name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Install luacheck
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck via luarocks
        run: luarocks install luacheck

      - name: Lint
        # luacheck exits 1 for warnings-only, 2 for errors.
        # bash -e kills on non-zero before `;` reaches the next command,
        # so use `||` compound form which is exempt from errexit.
        run: luacheck --config .luacheck . || [ $? -le 1 ]

      - name: Validate module map
        run: lua scripts/validate_module_map.lua

      - name: Run unit tests
        run: lua tests/run_tests.lua
