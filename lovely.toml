# ============================================================
# Game Over Panel: Inject "Rewind to Last Save" button
# ============================================================
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''              create_UIBox_round_scores_row('furthest_ante', G.C.FILTER),
              create_UIBox_round_scores_row('furthest_round', G.C.FILTER),
              create_UIBox_round_scores_row('defeated_by'),'''
position = "after"
match_indent = true
payload = '''
REWINDER and REWINDER.create_game_over_rewind_button and REWINDER.create_game_over_rewind_button(),'''





[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "function Card:open()"
position = "after"
match_indent = true
payload = "if REWINDER and REWINDER._SaveManager then REWINDER._SaveManager.skipping_pack_open = true end"

# Performance: avoid full recursive_table_cull on sections already serialized by :save().
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "G.culled_table =  recursive_table_cull{"
position = "at"
match_indent = true
payload = "G.culled_table = {"

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "GAME = G.GAME,"
position = "at"
match_indent = true
payload = "GAME = recursive_table_cull(G.GAME),"

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "ACTION = G.action or nil,"
position = "at"
match_indent = true
payload = "ACTION = G.action and recursive_table_cull(G.action) or nil,"

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "BACK = G.GAME.selected_back:save(),"
position = "at"
match_indent = true
payload = "BACK = recursive_table_cull(G.GAME.selected_back:save()),"

[[patches]]
[patches.regex]
target = "functions/misc_functions.lua"
pattern = '''BACK\s*=\s*G\.GAME\.selected_back:save\(\),'''
position = "at"
payload = "BACK = recursive_table_cull(G.GAME.selected_back:save()),"

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "if G.F_NO_SAVING == true then return end"
position = "after"
match_indent = true
payload = """
if REWINDER and REWINDER.should_skip_save_run and REWINDER.should_skip_save_run() then return end
if REWINDER and REWINDER.config and REWINDER.config.debug_saves then REWINDER._save_run_t0 = love.timer.getTime() end"""

[[patches]]
[patches.regex]
target = "functions/misc_functions.lua"
pattern = "G.ARGS.save_run = G.culled_table"
position = "after"
payload = """
   G.ARGS.rewinder_copy_path = nil
   G.ARGS.rewinder_meta_path = nil
   G.ARGS.rewinder_meta_data = nil
   G.FILE_HANDLER = G.FILE_HANDLER or {}
   if REWINDER and REWINDER.config and REWINDER.config.debug_saves and REWINDER._save_run_t0 and REWINDER.debug_log then REWINDER.debug_log("debug", string.format("save_run: %.2fms", (love.timer.getTime() - REWINDER._save_run_t0) * 1000)) end
   if REWINDER then REWINDER._save_run_t0 = nil end
   if REWINDER and REWINDER.validate_culled_table_once then REWINDER.validate_culled_table_once(G.culled_table) end
   if REWINDER and REWINDER._force_save_run_recull and recursive_table_cull and type(G.ARGS.save_run) == 'table' then
      local _rw_ok, _rw_reculled = pcall(recursive_table_cull, G.ARGS.save_run)
      if _rw_ok and type(_rw_reculled) == 'table' then
         G.ARGS.save_run = _rw_reculled
         G.culled_table = _rw_reculled
      end
   end
   if NaNProtection then NaNProtection.sanitize_round_scores_presave(G.GAME) end
   if REWINDER and REWINDER.defer_save_creation then REWINDER.defer_save_creation() end
   if REWINDER and REWINDER.flush_pending_rewinder then REWINDER.flush_pending_rewinder() end"""

# Create rewinder save at actual queue point (1:1 with save_run thread request).
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if G.FILE_HANDLER.run then"
position = "after"
match_indent = true
payload = """
local _rw_push_t0, _rw_q_before = nil, nil
if REWINDER and REWINDER.config and REWINDER.config.debug_saves then
   _rw_push_t0 = love.timer.getTime()
   if G and G.SAVE_MANAGER and G.SAVE_MANAGER.channel and G.SAVE_MANAGER.channel.getCount then
      _rw_q_before = G.SAVE_MANAGER.channel:getCount()
   end
end"""

# Profile full FILE_HANDLER flush cost (all save messages, same update tick).
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if G.FILE_HANDLER.metrics then"
position = "before"
match_indent = true
payload = """
local _rw_flush_t0 = nil
if REWINDER and REWINDER.config and REWINDER.config.debug_saves then _rw_flush_t0 = love.timer.getTime() end"""

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "G.FILE_HANDLER.force = false"
position = "before"
match_indent = true
payload = """
if _rw_flush_t0 and REWINDER and REWINDER.debug_log then
   local _rw_had_flush_work = (G and G.FILE_HANDLER and (G.FILE_HANDLER.metrics or G.FILE_HANDLER.progress or G.FILE_HANDLER.settings or G.FILE_HANDLER.run))
   if _rw_had_flush_work then
      REWINDER.debug_log("debug", string.format("file_handler_flush: %.2fms", (love.timer.getTime() - _rw_flush_t0) * 1000))
   end
end"""

# Thread piggyback: carry rewinder copy destination with vanilla save_run request
[[patches]]
[patches.regex]
target = "game.lua"
pattern = '''G\.SAVE_MANAGER\.channel:push\(\{\s*type = 'save_run',\s*save_table = G\.ARGS\.save_run,\s*profile_num = G\.SETTINGS\.profile\}\)'''
position = "at"
payload = """
local _rw_req = {
    type = 'save_run',
    save_table = G.ARGS.save_run,
    profile_num = G.SETTINGS.profile,
    rewinder_copy_path = G.ARGS.rewinder_copy_path,
    rewinder_meta_path = G.ARGS.rewinder_meta_path,
    rewinder_meta_data = G.ARGS.rewinder_meta_data
}
local _rw_ok, _rw_err = pcall(G.SAVE_MANAGER.channel.push, G.SAVE_MANAGER.channel, _rw_req)
if not _rw_ok then
    if REWINDER and REWINDER.recover_save_run_payload then
        _rw_req.save_table = REWINDER.recover_save_run_payload(_rw_req.save_table, _rw_err)
        local _rw_ok2, _rw_err2 = pcall(G.SAVE_MANAGER.channel.push, G.SAVE_MANAGER.channel, _rw_req)
        if not _rw_ok2 and REWINDER and REWINDER.debug_log then
            REWINDER.debug_log("error", "save_run_push failed after recovery: " .. tostring(_rw_err2))
        end
    elseif REWINDER and REWINDER.debug_log then
        REWINDER.debug_log("error", "save_run_push failed: " .. tostring(_rw_err))
    end
end
	if _rw_push_t0 and REWINDER and REWINDER.debug_log then
	   local _rw_q_after = nil
	   if G and G.SAVE_MANAGER and G.SAVE_MANAGER.channel and G.SAVE_MANAGER.channel.getCount then
	      _rw_q_after = G.SAVE_MANAGER.channel:getCount()
	   end
	   REWINDER.debug_log("debug", string.format("save_run_push: %.2fms q:%s->%s force=%s", (love.timer.getTime() - _rw_push_t0) * 1000, tostring(_rw_q_before), tostring(_rw_q_after), tostring(G.FILE_HANDLER and G.FILE_HANDLER.force)))
	end"""

# Thread piggyback: write save.jkr and rewinder copy from one packed/compressed blob
[[patches]]
[patches.pattern]
target = "engine/save_manager.lua"
pattern = "compress_and_save(prefix_profile..'save.jkr', request.save_table)"
position = "at"
match_indent = true
payload = """
local packed_save = STR_PACK(request.save_table)
local compressed_save = love.data.compress('string', 'deflate', packed_save, 1)
love.filesystem.write(prefix_profile..'save.jkr', compressed_save)
if request.rewinder_copy_path then
    love.filesystem.write(request.rewinder_copy_path, compressed_save)
end
if request.rewinder_meta_path and request.rewinder_meta_data then
    love.filesystem.write(request.rewinder_meta_path, request.rewinder_meta_data)
end"""

# Sanitize ALL round_scores.amt fields after loading a save (NaN serialized as nil)
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.GAME = saveTable and saveTable.GAME or self:init_game_object()"
position = "after"
match_indent = true
payload = "if NaNProtection then NaNProtection.sanitize_round_scores(self.GAME); NaNProtection.sanitize_game_blind(self.GAME); NaNProtection.ensure_game_chips(self.GAME) end"

# Recover blind chips from chip_text when legacy/corrupt saves lose numeric chips on load.
# Keeps target NaN/inf semantics without broad arithmetic fallbacks in score checks.
[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = "self.chips = blindTable.chips"
position = "at"
match_indent = true
payload = """
self.chips = (NaNProtection and NaNProtection.recover_blind_chips and NaNProtection.recover_blind_chips(blindTable.chips, blindTable.chip_text, self.chips)) or blindTable.chips or self.chips"""

# Keep blind chip text initialized if missing; otherwise preserve saved text as-is.
[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = "self.chip_text = blindTable.chip_text"
position = "at"
match_indent = true
payload = """
self.chip_text = (NaNProtection and NaNProtection.recover_blind_chip_text and NaNProtection.recover_blind_chip_text(blindTable.chip_text, self.chips)) or blindTable.chip_text"""

# Encode NaN/inf as explicit arithmetic expressions during serialization.
# This avoids bare `nan/inf` tokens that unpack as nil and crash later.
[[patches]]
[patches.regex]
target = "engine/string_packer.lua"
pattern = "if type_v == .boolean. then"
position = "before"
payload = "if type_v == 'number' then local _big = (REWINDER and REWINDER.config and REWINDER.config.big_backend_mode) or (NaNProtection and NaNProtection.has_big_backend and NaNProtection.has_big_backend()); if not _big then local _target = (i == '[\"chips\"]' and type(data) == 'table' and data.chip_text ~= nil); if v ~= v then local _ntxt = _target and type(data.chip_text) == 'string' and string.lower(data.chip_text) or nil; v = _target and ((_ntxt == '-nan') and '(-0/0)' or '(0/0)') or '(0/0)' elseif v == math.huge then v = '(1/0)' elseif v == -math.huge then v = '(-1/0)' end end end"

# Early prevention: recover missing G.GAME.chips and compute safe ease_to.
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '''ease_to = G\.GAME\.chips \+ math\.floor\([^\n]+\),'''
position = "at"
payload = "ease_to = (NaNProtection and NaNProtection.safe_ease_chips and NaNProtection.safe_ease_chips(hand_chips, mult)) or (G.GAME.chips + math.floor(hand_chips*mult)),"

# Defensive: sanitize ease event values in engine/event.lua
# Line 62: handle() re-reads start_val from ref_table (could be nil/NaN from corrupted save)
[[patches]]
[patches.pattern]
target = "engine/event.lua"
pattern = "self.ease.start_val = self.ease.ref_table[self.ease.ref_value]"
position = "at"
match_indent = true
payload = "self.ease.start_val = (NaNProtection and NaNProtection.sanitize_inline or function(v) return v ~= nil and v or 0 end)(self.ease.ref_table[self.ease.ref_value])"

# Line 31: sanitize end_val (ease_to) in case it's NaN from other code paths
[[patches]]
[patches.pattern]
target = "engine/event.lua"
pattern = "end_val = config.ease_to,"
position = "at"
match_indent = true
payload = "end_val = (NaNProtection and NaNProtection.sanitize_inline or function(v) return v ~= nil and v or 0 end)(config.ease_to),"

# Defensive: handle nil round_scores.amt in check_and_set_high_score (NaN loaded as nil).
[[patches]]
[patches.regex]
target = "functions/misc_functions.lua"
pattern = '''if G\.GAME\.round_scores\[score\] and math\.floor\(amt\) > (?:\(G\.GAME\.round_scores\[score\]\.amt or 0\)|G\.GAME\.round_scores\[score\]\.amt) then'''
position = "at"
payload = "if G.GAME.round_scores[score] and NaNProtection and NaNProtection.score_gt and NaNProtection.score_gt(amt, G.GAME.round_scores[score].amt) then"

# Defensive: handle nil high_scores.amt (same issue for profile high scores).
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "if G.PROFILES[G.SETTINGS.profile].high_scores[score] and math.floor(amt) > G.PROFILES[G.SETTINGS.profile].high_scores[score].amt then"
position = "at"
match_indent = true
payload = "if G.PROFILES[G.SETTINGS.profile].high_scores[score] and NaNProtection and NaNProtection.score_gt and NaNProtection.score_gt(amt, G.PROFILES[G.SETTINGS.profile].high_scores[score].amt) then"

# Install scale_number hook module
# Loads early as a module; install() is called from UI/ButtonCallbacks.lua
# (which is appended to button_callbacks.lua after scale_number is defined)
[[patches]]
[patches.module]
name = "ScaleNumberHook"
source = "Utils/ScaleNumberHook.lua"
load_now = true
before = "globals.lua"

[[patches]]
[patches.module]
name = "SaveListSync"
source = "UI/SaveListSync.lua"
before = "globals.lua"

[[patches]]
[patches.module]
name = "ExportService"
source = "Core/ExportService.lua"
before = "globals.lua"

[[patches]]
[patches.module]
name = "UIShared"
source = "UI/Shared.lua"
before = "globals.lua"

[[patches]]
[patches.module]
name = "UILayout"
source = "UI/Layout.lua"
before = "globals.lua"

[[patches]]
[patches.module]
name = "UIIconFactory"
source = "UI/IconFactory.lua"
before = "globals.lua"

[[patches]]
[patches.module]
name = "UISaveRows"
source = "UI/SaveRows.lua"
before = "globals.lua"

[[patches]]
[patches.module]
name = "UIOverlayBuilder"
source = "UI/OverlayBuilder.lua"
before = "globals.lua"

[[patches]]
[patches.module]
name = "UIButtonCallbackHelpers"
source = "UI/ButtonCallbackHelpers.lua"
before = "globals.lua"

# Allow per-input cursor color override (used by rewinder rename input).
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "local position_text_colour = lighten(copy_table(G.C.BLUE), 0.4)"
position = "at"
match_indent = true
payload = "local position_text_colour = (args.position_text_colour and copy_table(args.position_text_colour)) or lighten(copy_table(G.C.BLUE), 0.4)"

# Defensive blind-chip normalization at arithmetic callsites.
# Uses NaNProtection.chips_met_target() to recover nil chips while preserving NaN/inf semantics.
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = """if G.GAME.chips - G.GAME.blind.chips >= 0 then
                game_over = false
            end"""
position = "at"
match_indent = true
payload = """if NaNProtection and NaNProtection.chips_met_target and NaNProtection.chips_met_target() then
                game_over = false
            end"""

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = """if G.GAME.chips - G.GAME.blind.chips >= 0 then
        add_round_eval_row({dollars = G.GAME.blind.dollars, name='blind1', pitch = pitch})"""
position = "at"
match_indent = true
payload = """if NaNProtection and NaNProtection.chips_met_target and NaNProtection.chips_met_target() then
        add_round_eval_row({dollars = G.GAME.blind.dollars, name='blind1', pitch = pitch})"""

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if G.GAME.chips - G.GAME.blind.chips >= 0 or G.GAME.current_round.hands_left < 1 then"
position = "at"
match_indent = true
payload = "if (NaNProtection and NaNProtection.chips_met_target and NaNProtection.chips_met_target()) or G.GAME.current_round.hands_left < 1 then"

[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = "if self.boss and G.GAME.chips - G.GAME.blind.chips >= 0 then"
position = "at"
match_indent = true
payload = "if self.boss and (NaNProtection and NaNProtection.chips_met_target and NaNProtection.chips_met_target()) then"

# Defensive: run number_format sanitization before sign/abs handling.
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "function number_format(num, e_switch_point)"
position = "after"
match_indent = true
payload = "if NaNProtection then local v, early = NaNProtection.sanitize_number_format(num) if early then return v end num = v end"

# Continue menu: keep best-hand overflow text scale stable across restart/mod stack order.
[[patches]]
[patches.regex]
target = "functions/UI_definitions.lua"
pattern = """scale = scale_number\\(saved_game\\.GAME\\.round_scores\\.hand\\.amt, 0\\.8\\*scale(?:, 100000000000)?\\)"""
position = "at"
payload = """scale = (NaNProtection and NaNProtection.scale_continue_best_hand and NaNProtection.scale_continue_best_hand(saved_game.GAME.round_scores.hand.amt, 0.8*scale, 100000000000)) or scale_number(saved_game.GAME.round_scores.hand.amt, 0.8*scale, 100000000000)"""

# Patch check_and_set_high_score to handle inf/overflow
# round_scores/high_scores use NaNProtection assignment hooks
# (preserve NaN by default, optional inf clamp via config)
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "G.GAME.round_scores[score].amt = math.floor(amt)"
position = "at"
match_indent = true
payload = """G.GAME.round_scores[score].amt = (NaNProtection and NaNProtection.sanitize_round_score_assignment and NaNProtection.sanitize_round_score_assignment(amt)) or math.floor(amt)"""

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "G.PROFILES[G.SETTINGS.profile].high_scores[score].amt = math.floor(amt)"
position = "at"
match_indent = true
payload = """G.PROFILES[G.SETTINGS.profile].high_scores[score].amt = (NaNProtection and NaNProtection.sanitize_high_score_assignment and NaNProtection.sanitize_high_score_assignment(amt)) or math.floor(amt)"""
