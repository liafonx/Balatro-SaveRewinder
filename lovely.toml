[manifest]
version = "1.0"
dump_lua = true
priority = 5

# Save Rewinder mod for Balatro.
# Folder layout:
# SaveRewinderMod/
#     lovely.toml
#     Core/
#       Init.lua
#       SaveManager.lua (includes EntryConstants, CacheManager, DuplicateDetector)
#       GamePatches.lua
#     Utils/
#       StateSignature.lua
#       Logger.lua
#       MetaFile.lua
#       FileIO.lua
#       Pruning.lua
#       Keybinds.lua
#     UI/
#       RewinderUI.lua
#       ButtonCallbacks.lua
#     main.lua (Steamodded config)

[[patches]]
[patches.copy]
target = "globals.lua"
position = "append"
sources = [ "Core/Init.lua" ]

[[patches]]
[patches.copy]
target = "main.lua"
position = "append"
sources = [ "Utils/Keybinds.lua" ]

[[patches]]
[patches.copy]
target = "functions/UI_definitions.lua"
position = "append"
sources = [ "UI/RewinderUI.lua" ]

[[patches]]
[patches.copy]
target = "functions/button_callbacks.lua"
position = "append"
sources = [ "UI/ButtonCallbacks.lua" ]

[[patches]]
[patches.copy] # GamePatches is not a module; it's a set of global overrides.
target = "globals.lua"
position = "append"
sources = [ "Core/GamePatches.lua" ] # Appended after Init.lua (which is also appended to globals.lua)

