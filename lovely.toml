[manifest]
version = "1.0"
dump_lua = true
priority = 5

# Save Rewinder mod for Balatro.
# Folder layout:
# SaveRewinderMod/
#     lovely.toml
#     Core/
#       Init.lua
#       SaveManager.lua (includes EntryConstants, CacheManager, DuplicateDetector)
#       GamePatches.lua
#     Utils/
#       StateSignature.lua
#       Logger.lua
#       MetaFile.lua
#       FileIO.lua
#       Pruning.lua
#       Keybinds.lua
#     UI/
#       RewinderUI.lua
#       ButtonCallbacks.lua
#     main.lua (Steamodded config)

[[patches]]
[patches.copy]
target = "globals.lua"
position = "append"
sources = [ "Core/Init.lua" ]

[[patches]]
[patches.copy]
target = "main.lua"
position = "append"
sources = [ "Utils/Keybinds.lua" ]

[[patches]]
[patches.copy]
target = "functions/UI_definitions.lua"
position = "append"
sources = [ "UI/RewinderUI.lua" ]

[[patches]]
[patches.copy]
target = "functions/button_callbacks.lua"
position = "append"
sources = [ "UI/ButtonCallbacks.lua" ]

[[patches]]
[patches.copy] # GamePatches is not a module; it's a set of global overrides.
target = "globals.lua"
position = "append"
sources = [ "Core/GamePatches.lua" ] # Appended after Init.lua (which is also appended to globals.lua)

[[patches]]
[patches.module]
name = "Logger"
source = "Utils/Logger.lua"
load_now = true
before = "globals.lua"

[[patches]]
[patches.module]
name = "MetaFile"
source = "Utils/MetaFile.lua"
load_now = true
before = "globals.lua"

[[patches]]
[patches.module]
name = "FileIO"
source = "Utils/FileIO.lua"
load_now = true
before = "globals.lua"

[[patches]]
[patches.module]
name = "Pruning"
source = "Utils/Pruning.lua"
load_now = true
before = "globals.lua"

[[patches]]
[patches.module]
name = "StateSignature"
source = "Utils/StateSignature.lua"
load_now = true

before = "globals.lua"

[[patches]]
[patches.module]
name = "SaveManager"
source = "Core/SaveManager.lua"
load_now = true
before = "globals.lua"

[[patches]]
[patches.module]
name = "NaNProtection"
source = "Utils/NaNProtection.lua"
load_now = true
before = "globals.lua"

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "function Card:open()"
position = "after"
match_indent = true
payload = "if REWINDER and REWINDER._SaveManager then REWINDER._SaveManager.skipping_pack_open = true end"

[[patches]]
[patches.regex]
target = "functions/misc_functions.lua"
pattern = "G.ARGS.save_run = G.culled_table"
position = "after"
payload = """
   if NaNProtection then NaNProtection.sanitize_round_scores_presave(G.GAME) end
   if REWINDER and REWINDER.defer_save_creation then REWINDER.defer_save_creation() end"""

# Sanitize ALL round_scores.amt fields after loading a save (NaN serialized as nil)
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.GAME = saveTable and saveTable.GAME or self:init_game_object()"
position = "after"
match_indent = true
payload = "if NaNProtection then NaNProtection.sanitize_round_scores(self.GAME) end"

# Fix NaN/inf serialization crash: when score overflows to NaN or inf, saving produces
# "[chips]=nan" or "[chips]=inf" which loads as nil (undefined global), causing crash.
# Solution: sanitize NaN/inf values during serialization via NaNProtection module.
[[patches]]
[patches.regex]
target = "engine/string_packer.lua"
pattern = "if type_v == .boolean. then"
position = "before"
payload = "if type_v == 'number' and NaNProtection then v = NaNProtection.sanitize_serialize(v, k) end"

# Early prevention: sanitize chips ease_to calculation at the source.
# This catches NaN at the moment of calculation, before it enters the Event system.
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "ease_to = G.GAME.chips + math.floor(hand_chips*mult),"
position = "at"
match_indent = true
payload = "ease_to = (NaNProtection and NaNProtection.sanitize_inline or function(v) return (v and v==v) and v or 0 end)(G.GAME.chips + math.floor(hand_chips*mult)),"

# Defensive: sanitize ease event values in engine/event.lua
# Line 62: handle() re-reads start_val from ref_table (could be nil/NaN from corrupted save)
[[patches]]
[patches.pattern]
target = "engine/event.lua"
pattern = "self.ease.start_val = self.ease.ref_table[self.ease.ref_value]"
position = "at"
match_indent = true
payload = "self.ease.start_val = (NaNProtection and NaNProtection.sanitize_inline or function(v) return (v and v==v) and v or 0 end)(self.ease.ref_table[self.ease.ref_value])"

# Line 31: sanitize end_val (ease_to) in case it's NaN from other code paths
[[patches]]
[patches.pattern]
target = "engine/event.lua"
pattern = "end_val = config.ease_to,"
position = "at"
match_indent = true
payload = "end_val = (NaNProtection and NaNProtection.sanitize_inline or function(v) return (v and v==v) and v or 0 end)(config.ease_to),"

# Defensive: handle nil round_scores.amt in check_and_set_high_score (NaN loaded as nil).
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "if G.GAME.round_scores[score] and math.floor(amt) > G.GAME.round_scores[score].amt then"
position = "at"
match_indent = true
payload = "if G.GAME.round_scores[score] and math.floor(amt) > (G.GAME.round_scores[score].amt or 0) then"

# Defensive: handle nil high_scores.amt (same issue for profile high scores).
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "if G.PROFILES[G.SETTINGS.profile].high_scores[score] and math.floor(amt) > G.PROFILES[G.SETTINGS.profile].high_scores[score].amt then"
position = "at"
match_indent = true
payload = "if G.PROFILES[G.SETTINGS.profile].high_scores[score] and math.floor(amt) > (G.PROFILES[G.SETTINGS.profile].high_scores[score].amt or 0) then"

# Install scale_number hook module
# Loads early as a module; install() is called from UI/ButtonCallbacks.lua
# (which is appended to button_callbacks.lua after scale_number is defined)
[[patches]]
[patches.module]
name = "ScaleNumberHook"
source = "Utils/ScaleNumberHook.lua"
load_now = true
before = "globals.lua"


# Defensive: handle nil/NaN chips in multiple locations for existing corrupted saves.
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "if G.GAME.chips - G.GAME.blind.chips >= 0 then"
position = "at"
match_indent = true
payload = "if (G.GAME.chips or 0) - (G.GAME.blind.chips or 0) >= 0 then"

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if G.GAME.chips - G.GAME.blind.chips >= 0 or G.GAME.current_round.hands_left < 1 then"
position = "at"
match_indent = true
payload = "if (G.GAME.chips or 0) - (G.GAME.blind.chips or 0) >= 0 or G.GAME.current_round.hands_left < 1 then"

[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = "if self.boss and G.GAME.chips - G.GAME.blind.chips >= 0 then"
position = "at"
match_indent = true
payload = "if self.boss and (G.GAME.chips or 0) - (G.GAME.blind.chips or 0) >= 0 then"

# Defensive: handle NaN/nil in number_format display (prevents empty string crash in text.lua)
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "if not num or type(num) ~= 'number' then return num or '' end"
position = "at"
match_indent = true
payload = "if NaNProtection then local v, early = NaNProtection.sanitize_number_format(num) if early then return v end num = v elseif not num or type(num) ~= 'number' then return (type(num) == 'string' and num ~= '' and num) or '0' elseif num ~= num then num = 0 end"

# Defensive: guard against empty strings table in DynaText:align_letters (crash from corrupted scores)
[[patches]]
[patches.pattern]
target = "engine/text.lua"
pattern = "function DynaText:align_letters()"
position = "after"
match_indent = true
payload = "if NaNProtection and NaNProtection.dynatext_guard(self, 'align_letters') then return elseif not self.strings or not self.strings[self.focused_string] then return end"

# Defensive: guard DynaText:update_text against empty strings (line 288 crash)
[[patches]]
[patches.pattern]
target = "engine/text.lua"
pattern = "function DynaText:update_text()"
position = "after"
match_indent = true
payload = "if NaNProtection and NaNProtection.dynatext_guard(self, 'update_text') then return elseif not self.strings or not self.strings[self.focused_string] then return end"

# Defensive: guard DynaText:pop_in against empty strings
[[patches]]
[patches.pattern]
target = "engine/text.lua"
pattern = "function DynaText:pop_in()"
position = "after"
match_indent = true
payload = "if NaNProtection and NaNProtection.dynatext_guard(self, 'pop_in') then return elseif not self.strings or not self.strings[self.focused_string] then return end"
# Patch check_and_set_high_score to handle inf/overflow
# round_scores (continue panel): always convert inf to 0
# high_scores (Stats): respect clamp_infinity_scores setting
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "G.GAME.round_scores[score].amt = math.floor(amt)"
position = "at"
match_indent = true
payload = """G.GAME.round_scores[score].amt = (type(amt) == 'number' and (amt ~= amt or amt == math.huge or amt == -math.huge)) and 0 or math.floor(amt)"""

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "G.PROFILES[G.SETTINGS.profile].high_scores[score].amt = math.floor(amt)"
position = "at"
match_indent = true
payload = """G.PROFILES[G.SETTINGS.profile].high_scores[score].amt = (NaNProtection and NaNProtection.MAX_SAFE_SCORE and amt > NaNProtection.MAX_SAFE_SCORE and REWINDER and REWINDER.config and REWINDER.config.clamp_infinity_scores) and NaNProtection.MAX_SAFE_SCORE or math.floor(amt)"""
